name: CI
on:
  push:
    branches: [dev, main]
    paths-ignore: [LICENSE, 'README*.md', 'docs/**']
  pull_request:
    branches: [dev, main]
    paths-ignore: [LICENSE, 'README*.md', 'docs/**']
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-firefox
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'main'
        with:
          name: BewlyBewly
          path: |
            extension
            extension-firefox
